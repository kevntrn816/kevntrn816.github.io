<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{margin:0;height:100%;overflow:hidden;background:transparent}
.duo3d,.drop3d,.secu3d{position:absolute;inset:0;width:100%;height:100%;border-radius:0}
.duo3d{width:100%;position:relative}
.duo3d canvas{display:block;width:100%;height:100%}
.duo3d,.secu3d{background:none}
.drop3d{position:relative;width:100%;border-radius:24px;overflow:hidden;background:radial-gradient(120% 90% at 50% 30%,#FFFFFF 0%,#EDEDF0 75%)}
.drop3d canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
.drop3d{background:radial-gradient(120% 90% at 50% 30%,#FFFFFF 0%,#EDEDF0 75%)}
.secu3d{width:100%;position:relative}
.secu3d canvas{display:block;width:100%;height:100%}
.duo3d,.secu3d{background:none}
.macro{position:absolute;inset:0;z-index:1;opacity:0;pointer-events:none;overflow:hidden;background:#E9E9E9}
.macro-in{position:absolute;inset:0;transform-origin:56% 45%;will-change:transform}
.macro-in img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.macro .pocket{position:absolute;left:47.3%;top:33.2%;width:17.4%;height:23.2%;border-radius:22%;border:2px solid rgba(40,151,255,.95);background:rgba(40,151,255,.16);box-shadow:0 0 18px rgba(40,151,255,.55);transform-origin:0% 50%}
.macro .pocket::before,.macro .pocket::after{content:"";position:absolute;inset:-2px;border-radius:inherit;border:2px solid rgba(40,151,255,.8);opacity:0}
.macro .floor{position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(180deg,rgba(20,20,22,.0) 0,rgba(20,20,22,.85) 18%,#EDEDF0 60%);}
.macro .floor::before{content:"";position:absolute;left:-10%;right:-10%;top:12%;height:30px;background:radial-gradient(50% 50% at 50% 50%,rgba(0,0,0,.55),transparent);}
.macro.hit .pocket{animation:mSquash 3.6s cubic-bezier(.25,.7,.3,1) both}
.macro.hit .pocket::before{animation:mWave 3.4s ease-out .2s both}
.macro.hit .pocket::after{animation:mWave 3.4s ease-out 1s both}
.macro .ripple,.macro .glow,.macro .disp{position:absolute;pointer-events:none;opacity:0}
.macro .ripple{left:var(--cx);top:var(--cy);width:16%;height:4%;margin:-2% 0 0 -8%;border-radius:50%;border:2px solid rgba(40,151,255,.85)}
.macro .glow{left:var(--cx);top:var(--cy);width:30%;height:30%;margin:-15% 0 0 -15%;border-radius:50%;background:radial-gradient(closest-side,rgba(40,151,255,.75),rgba(40,151,255,0))}
.macro .disp{left:var(--cx);top:var(--cy);width:80%;height:7px;margin-top:-3.5px;transform-origin:0 50%;border-radius:7px;background:linear-gradient(90deg,#9FD0FF,rgba(40,151,255,.85) 45%,rgba(40,151,255,0));box-shadow:0 0 12px rgba(40,151,255,.7)}
.macro.hit .ripple{animation:sRipple 3.8s cubic-bezier(.15,.6,.3,1) both}
.macro.hit .glow{animation:sGlow 3.4s ease-out both}
.macro.hit .d1{animation:sDisp 3.6s cubic-bezier(.2,.6,.3,1) .15s both;--a:-24deg}
.macro.hit .d2{animation:sDisp 4s cubic-bezier(.2,.6,.3,1) .5s both;--a:-38deg;height:5px}
.macro.hit .d3{animation:sDisp 4.3s cubic-bezier(.2,.6,.3,1) .85s both;--a:-12deg;height:5px}
@keyframes mSquash{0%{transform:scale(1,1);background:rgba(40,151,255,.16)}16%{transform:scale(.66,1.1);background:rgba(40,151,255,.5);box-shadow:0 0 34px rgba(40,151,255,.9)}40%{transform:scale(1.06,.96);background:rgba(40,151,255,.28)}64%{transform:scale(.98,1.01)}100%{transform:scale(1,1);background:rgba(40,151,255,.16)}}
@keyframes mWave{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.4)}}
@keyframes sRipple{0%{opacity:.95;transform:scale(.3)}100%{opacity:0;transform:scale(5)}}
@keyframes sGlow{0%{opacity:0;transform:scale(.4)}18%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(2.2)}}
@keyframes sDisp{0%{opacity:0;transform:rotate(var(--a)) scaleX(0)}14%{opacity:1}100%{opacity:0;transform:rotate(var(--a)) scaleX(1)}}
