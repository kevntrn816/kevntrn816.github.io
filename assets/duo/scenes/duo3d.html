html,body{margin:0;height:100%;overflow:hidden;background:#F5F5F7}

.duo3d,.secu3d{background:none}

.macro.hit .pocket{animation:mSquash 3.6s cubic-bezier(.25,.7,.3,1) both}
.macro.hit .pocket::before{animation:mWave 3.4s ease-out .2s both}

.macro .ripple{left:var(--cx);top:var(--cy);width:16%;height:4%;margin:-2% 0 0 -8%;border-radius:50%;border:2px solid rgba(40,151,255,.85)}
.macro .glow{left:var(--cx);top:var(--cy);width:30%;height:30%;margin:-15% 0 0 -15%;border-radius:50%;background:radial-gradient(closest-side,rgba(40,151,255,.75),rgba(40,151,255,0))}

      x.strokeStyle='rgba(255,255,255,.035)';x.lineWidth=1;for(var k=0;k<60;k++){var yy=h*.74+k*h*.0045;x.beginPath();x.moveTo(0,yy+Math.sin(k)*4);x.quadraticCurveTo(w*.5,yy-h*.03,w,yy+Math.cos(k)*4);x.stroke()}
